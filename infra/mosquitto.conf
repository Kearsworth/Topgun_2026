# Dev/competition broker: closed team LAN, no auth.
#   mosquitto -c infra/mosquitto.conf -v
# Mosquitto 2.x only listens on localhost unless a listener is declared, so
# both listeners below bind all interfaces (ESP32 / Pi connect over WiFi).

listener 1883 0.0.0.0
protocol mqtt

# For browser dashboards (mqtt.js)
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
persistence false
